<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light" style="background: linear-gradient(135deg,#f2f8ff,#ffe5e5); min-height:100vh;">
  <!-- <nav class="navbar navbar-dark bg-danger shadow-sm"></nav> -->
   
<div class="container mt-5">
  <h1 class = "text-center">Welcome to Social Feed</h1>
   <h2 class="text-center">Please login to continue</h2>
  <div class="card p-4 mx-auto" style="max-width: 400px;">
    <h4 class="text-center">Login</h4>

    <input id="username" class="form-control mt-3" placeholder="Username">
    <input id="password" type="password" class="form-control mt-2" placeholder="Password">

    <button id="loginBtn" class="btn btn-primary w-100 mt-3">
       <span id="btnText">Login</span>

  <span id="spinner"
        class="spinner-border spinner-border-sm d-none"
        role="status">
  </span>
    </button>

    <div id="message" class="text-center mt-2">
      <a href="register.html">Sign up</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
