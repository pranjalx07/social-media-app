<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 mx-auto" style="max-width: 400px;">
    <h4 class="text-center">Create Account</h4>

    <form id="registerForm">
      <input type="text" id="username" class="form-control mt-3" placeholder="Username" required />
      <input type="email" id="email" class="form-control mt-2" placeholder="Email" required />
      <input type="password" id="password" class="form-control mt-2" placeholder="Password" required />
      <input type="text" id="address" class="form-control mt-2" placeholder="Address" required />
      
      <select id="gender" class="form-select mt-2" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
    </form>

    <div id="message" class="mt-2"></div>

    <div class="text-center mt-2">
      <a href="login.html">Already have an account? Login</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
