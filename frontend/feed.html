<!DOCTYPE html>
<html>
<head>
  <title>Feed</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="feed.html">Social Feed</a>
    <div>
      <a href="profile.html" class="btn btn-light btn-sm me-2">Profile</a>
      <a href="login.html" class="btn btn-light btn-sm" onclick="localStorage.clear()">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="card p-3 mb-4">
    <h5>Create a Post</h5>
    <textarea id="postContent" class="form-control" rows="3" placeholder="What's on your mind?"></textarea>
    <button id="postBtn" class="btn btn-success mt-2">Post</button>
  </div>

  <h5>Feed</h5>
  <div id="feed"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/post.js"></script>
</body>
</html>
