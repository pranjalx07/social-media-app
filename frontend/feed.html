<!DOCTYPE html>
<html>
<head>
  <title>Feed</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="feed.html">Social Feed</a>
    <div>
      <a href="profile.html" class="btn btn-light btn-sm me-2">Profile</a>
      <a href="login.html" class="btn btn-light btn-sm" onclick="localStorage.clear()">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="card p-3 mb-4">
    <h5>Create a Post</h5>
    <textarea id="postContent" class="form-control" rows="3" placeholder="What's on your mind?"></textarea>
    <button id="postBtn" class="btn btn-success mt-2">Post</button>
  </div>

  <h5>Feed</h5>
  <div id="feed"></div>
</div>
<div class="d-flex align-items-center mb-2">

    <!-- PROFILE PIC -->
    <img
        src="${p.profile_pic || '/uploads/default.png'}"
        class="rounded-circle me-2"
        width="45"
        height="45"
        style="object-fit:cover;">

    
      
    <div class="profile-hover-wrapper">

        <span class="fw-bold username-hover">
            ${p.username}
        </span>

        <!-- HOVER CARD -->
        <div class="profile-hover-card shadow-lg">

            <div class="d-flex align-items-center mb-3">

                <img
                    src="${p.profile_pic || '/uploads/default.png'}"
                    class="rounded-circle me-3"
                    width="70"
                    height="70"
                    style="object-fit:cover;">

                <div>

                    <h6 class="mb-0 fw-bold">
                        ${p.username}
                    </h6>

                    <small class="text-muted">
                        Joined Social Feed
                    </small>

                </div>

            </div>

            <p class="text-muted mb-2">
                ${p.bio || "No bio yet"}
            </p>

            <button class="btn btn-primary btn-sm rounded-pill px-3">
                View Profile
            </button>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/post.js"></script>
</body>
</html>
