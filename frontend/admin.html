<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Admin Login Section -->
<div id="adminLoginSection" class="container mt-5">
  <div class="card p-4 mx-auto" style="max-width: 400px;">
    <h4 class="text-center">Admin Login</h4>
    
    <input id="adminUsername" class="form-control mt-3" placeholder="Admin Username">
    <input id="adminPassword" type="password" class="form-control mt-2" placeholder="Admin Password">
    
    <button id="adminLoginBtn" class="btn btn-primary w-100 mt-3">Login as Admin</button>
  </div>
</div>

<!-- Admin Dashboard Section -->
<div id="adminDashboard" style="display:none;">
  <nav class="navbar navbar-dark bg-danger">
    <div class="container">
      <span class="navbar-brand">Admin Panel</span>
      <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h4>Pending User Approvals</h4>
    <div id="pendingUsers"></div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
